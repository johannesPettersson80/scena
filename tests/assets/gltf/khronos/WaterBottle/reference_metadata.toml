# WaterBottle reference image metadata for tests/m8_real_asset_proof.rs.
#
# After Phase 5.5 there are TWO bundled references with distinct
# purposes — see [scena_gold] and [blender_cycles] below.

[scena_cpu_256]
# Always-on CPU regression baseline for Q01. The test invokes the real
# WaterBottle importer and deterministic software renderer at 256x256 in the
# default cargo-test lane, then compares the live frame against this file.
relative_path = "reference_cpu_256.png"
sha256 = "922cc35e0c6420d2b3f8e533891291a9d4f9396697ae366f0b93de3c15973da4"
width = 256
height = 256
generated_at = "2026-07-17"
generated_by = "scena deterministic CPU renderer, PBR Neutral, studio directional lights"
purpose = "default-lane live WaterBottle CPU regression baseline"
color_type = "RGBA8"
color_space = "sRGB output"
row_orientation = "top-to-bottom; PNG row zero is the rendered top row"
alpha_contract = "opaque RGBA8"
comparison = "RGB Chebyshev <=4 for at least 99.5% of pixels, RGB RMSE <=2.0, zero alpha mismatches"
mutations = "one post-hoc-pixel mutation (flattened reflectance) plus fresh rendered-scene mutations for wrong material and wrong camera must each fail the same oracle"
known_bad_mutations = ["flattened_chrome", "wrong_material", "wrong_camera"]
mutation_provenance = "every mutation records its PNG hash, failing metrics, mutation_stage, render_count, and pipeline_coverage; wrong material/camera are changed before prepare and rendered through the importer/resources/CPU material or camera/tonemap/output path"

[scena_cpu_256.regeneration]
candidate_command = "scripts/stage_q01_waterbottle_reference_candidate.sh"
promotion_command = "node scripts/promote_q01_waterbottle_reference.cjs <candidate-dir> <approval.json>"
candidate_only = true
clean_checkout_required = true
generator_version = "scena 1.9.0 / rustc 1.93.1"
source_asset_sha256 = "0596f4e61dc781439d254fdfb5e3462daf1762c18715e3e3ac13001aa8f3f547"
external_anchor_sha256 = "17db39248ce1966ae60c3b85d09491ebfb7f654777dc2d150a64db4e938a6883"
approval_schema = "scena.q11.reference_approval.v1"
approval_template = "docs/reference-approval-q11.example.json"
approval_requirements = "separately authored named-human approval bound to generator commit, candidate hash, prior-reference hash, diff heatmap hash, and reviewed Blender external anchor"
tolerance_policy = "Chebyshev/RMSE/fraction thresholds may not be loosened during regeneration; any future policy change requires separate measured cross-architecture evidence and review"
stability_artifacts = ["q11-reference-stability/linux-x86_64.json", "q11-reference-stability/macos-aarch64.json", "q11-reference-stability/windows-x86_64.json"]
legacy_baseline_lineage_commit = "ac3e0539ecf8a3535f3749b5ebc714f75ebb4d2f"

[scena_gold]
# Regression-prevention baseline. Bit-identical to scena's GPU output
# at the time Phase 1 landed; consumed by Phase 2's tight per-region
# asserts + required full-frame RGB Chebyshev diff in native release lanes
# (`SCENA_REFERENCE_DIFF=1`). The same oracle must reject a horizontal mirror;
# sparse region/histogram checks alone are diagnostic and cannot claim release
# evidence.
relative_path = "reference_512.png"
sha256 = "4db449cdacf2340f8fa53937c28e5c4b5e2c7deaea73cbe0987dcd51eb93c751"
width = 512
height = 512
generated_at = "2026-05-12"
generated_by = "scena GPU pipeline (llvmpipe Mesa lavapipe Vulkan, Khronos PBR Neutral)"
purpose = "scena-gold regression baseline"
diff_tolerance = "required release oracle: RGB Chebyshev ≤16 for at least 95% of pixels; horizontal mirror must fail; diff heatmap and worst-region bbox retained"

