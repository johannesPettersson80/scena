[suite]
name = "m2-headless-core"
format = "ppm"
encoding = "srgb8"
dimensions = "per-fixture"
artifact_dir = "target/gate-artifacts/m2-visual"
reference = "tests/visual/references/m2-headless-core.toml"
reference_frames = "tests/visual/references/m2-headless-core-frames.toml"
reference_mode = "local-structure-v2"
window_size = 8
window_stride = 4
mean_window_ssim_min = 0.97
worst_window_ssim_min = 0.70
edge_iou_min = 0.85
foreground_iou_min = 0.95
status = "artifact-proof"

[[fixture]]
name = "direct-lights-pbr"
required_surface = "headless-cpu"
proof_class = "paired-effect-footprint"
production_claim = false
pair = "off-left-on-right"
spatial_mask = [0, 0, 16, 16]
contract = "PBR mesh output responds to scene direct-light color"

[[fixture]]
name = "shadowed-directional-light"
required_surface = "headless-cpu"
proof_class = "paired-effect-footprint"
production_claim = false
pair = "receiver-without-caster-left-receiver-with-caster-right"
spatial_mask = [30, 30, 50, 50]
contract = "a caster visibly darkens the declared receiver region while shadow-map and PCF resources remain active"

