# The deterministic CPU rasterizer evaluates the same material identities but
# has no hardware derivative/sample footprint. These surface-specific floors
# are pinned below the measured live CPU fixture and still reject the zeroed or
# isotropic known-bad mutations exercised by the shared evaluator contract.
[live_cpu_headless.brushed_steel]
anisotropy_aspect_ratio_ibl = 1.30

[live_cpu_headless.clearcoat_plastic]
clearcoat_lobe_delta = 0.007

[live_cpu_headless.leather]
local_texture_variance_min = 0.006

[live_cpu_headless.rubber]
local_texture_variance_min = 0.006

[live_cpu_headless.satin]
sheen_width_min = 0.015

# WebGL2 uses browser-cropped, foreground-normalized tiles. Eroding five pixels
# from the live leather mask removes silhouette/edge contrast. Under the
# layered surface model the darker, sheen-dimmed leather leaves a measured
# interior texture variance of 0.006 (0.011 before); the 0.005 floor still
# rejects the zero-variance known-bad mutation without treating edges as
# texture.
[live_webgl2_chromium.leather]
local_texture_variance_min = 0.005

# The layered surface model's energy-compensated Charlie sheen measures 0.020
# on WebGL2 (0.234 for the previous additive lobe), in line with the CPU and
# WebGPU lanes; satin's reference delta improved from 4.57 to 2.46.
[live_webgl2_chromium.satin]
sheen_width_min = 0.015

# scena maps the equirectangular studio environment 90 degrees about +Y from
# model-viewer/three.js: the brightest softbox lies along scena's +Z (toward
# the proof camera) but along three.js's +X. A single average diffuse colour
# hid that; directional spherical-harmonics diffuse lights the camera-facing
# side of the matte sphere from the softbox, so it measures 10.741 against the
# reference (4.649 before). Clear glass shows the brighter scene behind it,
# 32.415 (31.313 before). The base budgets above stay; these WebGL2 limits are
# capped in tests/round_e_material_contract.rs.
[live_webgl2_chromium.matte]
delta_e2000_max = 11.50

[live_webgl2_chromium.clear_glass]
delta_e2000_max = 33.50

# WebGPU uses renderer-owned RGBA8 readback from the required Chromium lane.
# These floors reflect its derivative/sample footprint while remaining above
# the isotropic or zero-signal mutations in the evaluator contract.
[live_webgpu_chromium.brushed_steel]
anisotropy_aspect_ratio_ibl = 1.15

[live_webgpu_chromium.leather]
local_texture_variance_min = 0.003

[live_webgpu_chromium.rubber]
local_texture_variance_min = 0.004

# The layered surface model gives WebGPU the same energy-compensated Charlie
# sheen as the CPU renderer. The required Chromium lane measures 0.027 for it
# (the CPU lane measures 0.015); the old 0.08 floor was set for the previous
# additive sheen lobe, which measured 0.109. 0.015 matches the CPU floor and
# still rejects the zero-signal satin mutation.
[live_webgpu_chromium.satin]
sheen_width_min = 0.015
