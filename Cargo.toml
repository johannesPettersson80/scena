[package]
name = "scena"
version = "1.10.4"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
authors = ["Johannes Pettersson <johannes_salomon@hotmail.com>"]
repository = "https://github.com/johannesPettersson80/scena"
description = "A Rust-native scene-graph renderer with typed scene state, glTF assets, and explicit prepare/render lifecycles."
readme = "README.md"
documentation = "https://docs.rs/scena"
keywords = ["renderer", "scene-graph", "gltf", "webgpu", "wasm"]
categories = ["graphics", "rendering", "wasm"]
include = [
    "/src/**",
    "/tests/*.rs",
    "/tests/browser/**",
    "/tests/assets/stable-contracts/**",
    "/tests/assets/environment/neutral-studio.fixture.txt",
    "/tests/assets/environment/PRESET-LICENSES.md",
    "/tests/assets/environment/generated/**",
    "/tests/assets/environment/polyhaven/**",
    "!/tests/assets/environment/polyhaven/*.prefilter.bin",
    "/tests/assets/gltf/AGENT-TEMPLATE-ASSETS-LICENSE.md",
    "/tests/assets/gltf/material_variants_scene.gltf",
    "/tests/assets/gltf/animated_triangle_scene.glb",
    "/tests/assets/gltf/cad_plate_drawing_scene.gltf",
    "/examples/**",
    "!/examples/furuta_render.rs",
    "/docs/**/*.md",
    "/docs/assets/**/*.png",
    "/docs/assets/**/*.jpg",
    "/docs/assets/easy-scene-showcase/**/*.gif",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-*",
    "/Cargo.toml",
    "/Cargo.lock",
]

[workspace]
members = [".", "crates/xtask"]
resolver = "3"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[example]]
name = "scene_inspection"
path = "examples/scene_inspection.rs"
required-features = ["inspection"]

[[example]]
name = "scene_host_contracts"
path = "examples/scene_host_contracts.rs"
required-features = ["scene-host"]

[[example]]
name = "scene_host_release_1_7"
path = "examples/scene_host_release_1_7.rs"
required-features = ["scene-host"]

[[example]]
name = "asset_catalog_picker"
path = "examples/asset_catalog_picker.rs"
required-features = ["scene-host"]

[[example]]
name = "product_configurator"
path = "examples/product_configurator.rs"
required-features = ["scene-host"]

[[example]]
name = "application_builder_lab"
path = "examples/application_builder_lab.rs"
required-features = ["scene-host"]

[[example]]
name = "native_surface_hardware_proof"
path = "examples/native_surface_hardware_proof.rs"

[dependencies]
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
earcut = "0.4.11"
fontdue = "0.9"
half = { version = "2.7", features = ["bytemuck"] }
glam = { version = "0.32", default-features = false, features = ["std", "scalar-math", "serde"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras", "extensions", "image", "import", "allow_empty_texture", "KHR_lights_punctual", "KHR_materials_unlit", "KHR_materials_emissive_strength", "KHR_texture_transform", "KHR_materials_variants"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
bevy_mikktspace = { version = "1", default-features = false, features = ["std"] }
ktx2 = { version = "0.5.0", optional = true }
basisu_c_sys = { version = "0.7.1", features = ["encoder", "extra"], optional = true }
meshopt = { version = "0.6.2", optional = true }
notify-debouncer-full = { version = "0.7.0", optional = true }
palette = { version = "0.7.6", default-features = false, features = ["std"] }
png = "0.18"
radiant = "0.3"
raw-window-handle = "0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.11"
slotmap = "1.0"
urlencoding = "2"
wgpu = { version = "29.0.3", features = ["webgl"] }

[features]
default = []
agent = ["scene-host", "material-library"]
controls = []
controls-winit = ["controls"]
controls-web = ["controls"]
browser-probe = ["viewer-element"]
demo-page = ["web-sys/Blob", "web-sys/Url"]
proof-harness = ["demo-page"]
viewer-element = []
inspection = []
scene-host = ["inspection"]
hot-reload = ["dep:notify-debouncer-full"]
khronos-samples = []
ktx2 = ["dep:ktx2", "dep:basisu_c_sys"]
meshopt = ["dep:meshopt"]
material-library = ["dep:ureq", "dep:zip"]
obj = []
production-assets = ["ktx2", "meshopt"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[package.metadata.scena.cli-install]
default-contract = "core-discovery-validation"
application-builder-feature = "agent"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.perf-test]
inherits = "release"
panic = "unwind"
strip = "debuginfo"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4.0"
rayon = "1.11"
ureq = { version = "3.3.0", optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.98"
pollster = "0.4.0"
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = [
    "Blob",
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "ImageBitmap",
    "ImageBitmapOptions",
    "ImageData",
    "Response",
    "console",
    "Window",
] }

[dev-dependencies]
naga = { version = "29.0.3", features = ["glsl-out", "spv-out"] }
png = "0.18"
pollster = "0.4.0"
winit = "0.30.13"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.71"
