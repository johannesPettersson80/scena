name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to verify/publish, for example v1.3.0"
        required: false
        type: string
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.93.1"
  # GitHub-hosted runners do not retain debug symbols, and the full all-targets
  # release matrix otherwise exhausts the runner disk while linking.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  NODE_VERSION: "20.20.0"
  PLAYWRIGHT_VERSION: "1.59.1"
  BINARYEN_VERSION: "129.0.0"
  BROTLI_CLI_VERSION: "2.1.1"

jobs:
  linux-native-vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: rustfmt, clippy
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          LVP_ICD="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)"
          test -n "$LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
      - name: Native release lane
        env:
          SCENA_REQUIRE_PARITY: "1"
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p xtask
          cargo test -p xtask -- --list > target/xtask-test-list.txt
          grep -Fqx 'app::tests_08::release_readiness_rejects_constant_ppm_visual_artifact: test' target/xtask-test-list.txt
          cargo test -p xtask app::tests_08::release_readiness_rejects_constant_ppm_visual_artifact -- --exact
          cargo test
          cargo test --features inspection --test measurement_visual_proof
          cargo test --lib --features scene-host scene_host::core_tests::c13_
          SCENA_RELEASE_COMMIT="$GITHUB_SHA" SCENA_RELEASE_PROFILE="test-unoptimized" \
            cargo test --test m5_release
          bash scripts/release_lane_command.sh linux-native-vulkan cargo test --test m9_platform_release
          SCENA_M9_TIMING_POLICY=report-only-hosted SCENA_RUN_M9_PLATFORM_BENCHMARK=1 bash scripts/release_lane_command.sh linux-native-vulkan cargo test --test m9_platform_release m9_platform_benchmark_writes_release_artifact -- --exact --test-threads=1
          bash scripts/release_lane_command.sh headless-cpu cargo test --test m9_platform_release
          bash scripts/release_lane_command.sh headless-cpu cargo test --test q01_waterbottle_cpu_reference q01_default_cpu_waterbottle_matches_reference_and_rejects_known_bad_renders -- --exact
          bash scripts/release_lane_command.sh headless-cpu cargo test --test q01_waterbottle_cpu_reference q11_waterbottle_cpu_is_byte_deterministic_before_reference_comparison -- --exact
          bash scripts/release_lane_command.sh headless-cpu cargo test --test examples_visual_proof q02_live_cpu_round_e_showcase_emits_shared_evaluator_frame -- --exact
          bash scripts/release_lane_command.sh headless-cpu node scripts/evaluate_round_e_cpu_materials.cjs
          bash scripts/release_lane_command.sh linux-native-vulkan cargo check --examples --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
          cargo run -p xtask -- doctor --full
          cargo run -p xtask -- release-lane-artifact linux-native-vulkan
          cargo run -p xtask -- release-lane-artifact headless-cpu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-linux-native-vulkan
          path: target/gate-artifacts/**
          if-no-files-found: error

  linux-browser-webgl2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.0"
          cache: npm
      - name: Browser WebGL2 release lane
        env:
          SCENA_BROWSER_BACKENDS: webgl2
        run: |
          npm ci
          npx playwright install chromium --with-deps
          cargo install wasm-pack --version 0.14.0 --locked
          cargo test --lib render::gpu::shader_manifest::tests -- --nocapture
          wasm-pack test --headless --chrome --test m1_browser_rendered_output
          wasm-pack test --headless --chrome --test m3a_browser_rendered_output
          wasm-pack test --headless --chrome --test m3b_browser_rendered_output
          wasm-pack test --headless --chrome --test m6_browser_renderer_parity --features browser-probe
          bash scripts/release_lane_command.sh linux-webgl2-chromium wasm-pack build --dev --target web --out-dir target/m6-browser-pkg . --features browser-probe
          bash scripts/release_lane_command.sh linux-webgl2-chromium npm run browser:m6
          bash scripts/release_lane_command.sh linux-webgl2-chromium npm run browser:scene-host-proof
          bash scripts/release_lane_command.sh linux-webgl2-chromium npm run browser:fr06-semantic-aov
          bash scripts/release_lane_command.sh linux-webgl2-chromium npm run demo:build
          bash scripts/release_lane_command.sh linux-webgl2-chromium npm run proof:build
          SCENA_DOCTOR_REQUIRE_GENERATED_ARTIFACTS=1 cargo run -p xtask -- doctor --full
          python3 -m http.server 18104 --directory demo > target/gate-artifacts/cloudflare-demo-server.log 2>&1 &
          demo_server_pid=$!
          trap 'kill "$demo_server_pid" 2>/dev/null || true' EXIT
          bash scripts/release_lane_command.sh linux-webgl2-chromium npm run cloudflare:demo -- http://127.0.0.1:18104/index.html
          bash scripts/release_lane_command.sh linux-webgl2-chromium npm run cloudflare:materials -- http://127.0.0.1:18104/proof/?sample=material-presets
          kill "$demo_server_pid" 2>/dev/null || true
          trap - EXIT
          cargo run -p xtask -- release-lane-artifact linux-webgl2-chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-linux-webgl2-chromium
          path: target/gate-artifacts/**
          if-no-files-found: error

  linux-browser-webgpu:
    name: Linux browser WebGPU software conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.0"
          cache: npm
      - name: Browser WebGPU release lane
        env:
          SCENA_BROWSER_BACKENDS: webgpu
          SCENA_GPU_EVIDENCE_CLASS: "software-conformance"
        run: |
          npm ci
          npx playwright install chromium --with-deps
          cargo install wasm-pack --version 0.14.0 --locked
          cargo test --lib render::gpu::shader_manifest::tests -- --nocapture
          npm run test:required-gpu-parity
          bash scripts/release_lane_command.sh linux-webgpu-chromium wasm-pack build --dev --target web --out-dir target/m6-browser-pkg . --features browser-probe
          bash scripts/release_lane_command.sh linux-webgpu-chromium npm run browser:q02-materials
          bash scripts/release_lane_command.sh linux-webgpu-chromium npm run browser:m6
          bash scripts/release_lane_command.sh linux-webgpu-chromium npm run browser:fr06-semantic-aov
          cargo run -p xtask -- release-lane-artifact linux-webgpu-chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-linux-webgpu-chromium
          path: target/gate-artifacts/**
          if-no-files-found: error

  wasm32-unknown-unknown:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.0"
          cache: npm
      - name: WASM release lane
        run: |
          npm ci
          cargo check --target wasm32-unknown-unknown --all-features
          cargo install wasm-pack --version 0.14.0 --locked
          bash scripts/release_lane_command.sh wasm32-unknown-unknown wasm-pack build --release --target web --out-dir target/m9-browser-pkg . --features browser-probe
          bash scripts/release_lane_command.sh wasm32-unknown-unknown npm run wasm:size
          cargo run -p xtask -- release-lane-artifact wasm32-unknown-unknown
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-wasm32-unknown-unknown
          path: |
            target/m9-browser-pkg/**
            target/gate-artifacts/**
          if-no-files-found: error

  macos-metal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: rustfmt, clippy
      - name: macOS release lane
        run: |
          cargo test --all-targets
          bash scripts/release_lane_command.sh macos-metal cargo test --test m9_platform_release
          bash scripts/release_lane_command.sh macos-metal cargo test --test q01_waterbottle_cpu_reference q11_waterbottle_cpu_is_byte_deterministic_before_reference_comparison -- --exact
          SCENA_M9_TIMING_POLICY=report-only-hosted SCENA_RUN_M9_PLATFORM_BENCHMARK=1 bash scripts/release_lane_command.sh macos-metal cargo test --test m9_platform_release m9_platform_benchmark_writes_release_artifact -- --exact --test-threads=1
          SCENA_REFERENCE_DIFF=1 SCENA_RUN_UNSTABLE_HEADLESS_GPU_RELEASE_TESTS=1 bash scripts/release_lane_command.sh macos-metal cargo test --test m8_real_asset_proof m8_real_asset_waterbottle_gpu_headline -- --exact
          SCENA_REQUIRE_AA_EFFECT_PROOF=1 bash scripts/release_lane_command.sh macos-metal cargo test --test q07_antialiasing_effect q07_required_native_antialiasing_modes_have_pixel_effect -- --exact
          SCENA_REQUIRE_GPU_PARITY=1 bash scripts/release_lane_command.sh macos-metal cargo test --test transmission_parity physical_glass_transmission_matches_cpu_and_gpu_across_volume_sweep -- --exact
          SCENA_REQUIRE_GPU_PARITY=1 bash scripts/release_lane_command.sh macos-metal cargo test --test c13_depth_clipping_parity close_camera_near_clip_matches_cpu_and_gpu_rendered_output -- --exact
          SCENA_REQUIRE_GPU_PARITY=1 bash scripts/release_lane_command.sh macos-metal cargo test --test dynamic_transform_parity dynamic_transform_motion_matches_cpu_and_gpu_for_authored_animation_and_imports -- --exact
          SCENA_REQUIRE_GPU_PARITY=1 bash scripts/release_lane_command.sh macos-metal cargo test --test dynamic_transform_parity z_up_imported_rotation_frame_matches_cpu_and_gpu_after_basis_conversion -- --exact
          SCENA_REQUIRE_GPU_PARITY=1 bash scripts/release_lane_command.sh macos-metal cargo test --test pbr_brdf_parity core_pbr_brdf_matches_cpu_and_gpu_across_metallic_roughness_sweep -- --exact
          SCENA_REQUIRE_GPU_PARITY=1 bash scripts/release_lane_command.sh macos-metal cargo test --test pf08_texture_bake_parity pf08_adaptive_texture_bake_preserves_seams_perspective_and_material_identity_cpu_gpu -- --exact
          bash scripts/release_lane_command.sh macos-metal cargo check --examples --all-features
      - name: Required physical GPU resource lifecycle
        env:
          SCENA_REQUIRE_GPU_RESOURCE_LIFECYCLE: "1"
        run: >-
          SCENA_REQUIRE_GPU_RESOURCE_LIFECYCLE=1
          bash scripts/release_lane_command.sh macos-metal
          cargo test --test c09_gpu_resource_lifecycle
          required_hardware_gpu_resource_lifecycle_executes_complete_cycle
          -- --exact --nocapture
      - name: Release lane artifact
        run: cargo run -p xtask -- release-lane-artifact macos-metal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-macos-metal
          path: target/gate-artifacts/**
          if-no-files-found: error

  windows-dx12:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: rustfmt, clippy
      - name: Windows release lane
        shell: bash
        run: |
          cargo test --all-targets
          bash scripts/release_lane_command.sh windows-dx12 cargo test --test m9_platform_release
          bash scripts/release_lane_command.sh windows-dx12 cargo test --test q01_waterbottle_cpu_reference q11_waterbottle_cpu_is_byte_deterministic_before_reference_comparison -- --exact
          SCENA_M9_TIMING_POLICY=report-only-hosted SCENA_RUN_M9_PLATFORM_BENCHMARK=1 bash scripts/release_lane_command.sh windows-dx12 cargo test --test m9_platform_release m9_platform_benchmark_writes_release_artifact -- --exact --test-threads=1
          bash scripts/release_lane_command.sh windows-dx12 cargo check --examples --all-features
          cargo run -p xtask -- release-lane-artifact windows-dx12
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-windows-dx12
          path: target/gate-artifacts/**
          if-no-files-found: error

  headless-4k-performance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
      - name: Dedicated 4K benchmark
        env:
          SCENA_RUN_DEDICATED_4K_BENCHMARK: "1"
          SCENA_M9_TIMING_POLICY: report-only-hosted
          SCENA_BENCHMARK_PROFILE: perf-test
          SCENA_BENCHMARK_COMMAND: cargo test --profile perf-test --test m9_platform_release m9_dedicated_headless_4k_benchmark_writes_release_blocker_artifact
        run: cargo test --profile perf-test --test m9_platform_release m9_dedicated_headless_4k_benchmark_writes_release_blocker_artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-headless-4k-performance
          path: target/gate-artifacts/**
          if-no-files-found: error

  publish:
    needs:
      - linux-native-vulkan
      - linux-browser-webgl2
      - linux-browser-webgpu
      - wasm32-unknown-unknown
      - macos-metal
      - windows-dx12
      - headless-4k-performance
    runs-on: ubuntu-24.04
    environment: crates-io
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: rustfmt, clippy
      - name: Download release lane artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: target/release-artifacts
      - name: Bind downloaded evidence to this workflow run
        run: node scripts/ci_provenance.js target/release-artifacts target/release-artifacts/ci-provenance.json
      - name: Attest exact release-evidence manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: target/release-artifacts/ci-provenance.json
      - name: Stage release artifacts for readiness
        env:
          GH_TOKEN: ${{ github.token }}
          SCENA_REQUIRE_CI_PROVENANCE: "1"
        shell: bash
        run: |
          cargo run -p xtask -- stage-release-artifacts target/release-artifacts target/gate-artifacts
      - name: Release readiness
        env:
          GH_TOKEN: ${{ github.token }}
          SCENA_REQUIRE_CI_PROVENANCE: "1"
          SCENA_RELEASE_ARTIFACT_ROOT: target/gate-artifacts
        run: cargo run -p xtask -- release-readiness
      - name: Restore publish checkout cleanliness
        shell: bash
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock changed while preparing release readiness; restoring the committed lockfile before publish."
            git diff -- Cargo.lock
            git checkout -- Cargo.lock
          fi
          git diff --exit-code
      - name: Clean publish dry run
        run: cargo publish --dry-run --locked
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          SCENA_RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          case "$SCENA_RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must start with v: ${SCENA_RELEASE_TAG}" >&2
              exit 1
              ;;
          esac
          version="${SCENA_RELEASE_TAG#v}"
          status="$(
            curl --silent --show-error --output /tmp/scena-crate-version.json \
              --retry 3 --retry-delay 2 \
              --header "User-Agent: scena-release-workflow (https://github.com/johannesPettersson80/scena)" \
              --write-out "%{http_code}" \
              "https://crates.io/api/v1/crates/scena/${version}"
          )"
          case "$status" in
            200)
              echo "scena ${version} already exists on crates.io; skipping cargo publish"
              ;;
            404)
              cargo publish --locked
              ;;
            *)
              echo "Unexpected crates.io status ${status} while checking scena ${version}" >&2
              cat /tmp/scena-crate-version.json >&2 || true
              exit 1
              ;;
          esac
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SCENA_RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          notes_file="docs/release-notes/${SCENA_RELEASE_TAG}.md"
          if [[ ! -f "$notes_file" ]]; then
            notes_file="CHANGELOG.md"
          fi
          if gh release view "${SCENA_RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${SCENA_RELEASE_TAG}" --notes-file "$notes_file" --latest
          else
            gh release create "${SCENA_RELEASE_TAG}" --verify-tag --notes-file "$notes_file" --latest
          fi
