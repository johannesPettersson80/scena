name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

env:
  RUST_TOOLCHAIN: "1.93.1"
  WASM_PACK_VERSION: "0.14.0"
  NODE_VERSION: "20.20.0"
  NPM_VERSION: "10.8.2"
  PLAYWRIGHT_VERSION: "1.59.1"
  BINARYEN_VERSION: "129.0.0"
  BROTLI_CLI_VERSION: "2.1.1"

jobs:
  linux-native-vulkan:
    name: Linux native/headless
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: rustfmt, clippy
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          LVP_ICD="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)"
          test -n "$LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
      - name: Cargo gates
        env:
          SCENA_REQUIRE_PARITY: "1"
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p xtask
          cargo test -p xtask -- --list | grep -Fqx 'app::tests_08::release_readiness_rejects_constant_ppm_visual_artifact: test'
          cargo test -p xtask app::tests_08::release_readiness_rejects_constant_ppm_visual_artifact -- --exact
          cargo test
          cargo test --doc
          SCENA_RELEASE_COMMIT="$GITHUB_SHA" SCENA_RELEASE_PROFILE="test-unoptimized" \
            cargo test --test m5_release
          cargo test --lib --features scene-host,inspection
          cargo test --lib --features scene-host scene_host::core_tests::c13_
          cargo test --features scene-host,inspection --test scene_recipe_contracts --test label_text
          cargo test --features scene-host,inspection --test scena_cli_agent_templates
          cargo test --features inspection --test scena_cli_recipe --test scena_cli_agent
          cargo test --features inspection --test m7_threejs_ergonomics m7_scene_inspection
          cargo test --features inspection --test measurement_visual_proof
          cargo test --features ktx2 --test m8_assets_materials_ecosystem m8_ktx2_basisu_feature_loads_compressed_texture_descriptor
          bash scripts/release_lane_command.sh linux-native-vulkan cargo test --test m9_platform_release
          bash scripts/release_lane_command.sh headless-cpu cargo test --test m9_platform_release
          bash scripts/release_lane_command.sh headless-cpu cargo test --test q01_waterbottle_cpu_reference q01_default_cpu_waterbottle_matches_reference_and_rejects_known_bad_renders -- --exact
          bash scripts/release_lane_command.sh headless-cpu cargo test --test examples_visual_proof q02_live_cpu_round_e_showcase_emits_shared_evaluator_frame -- --exact
          bash scripts/release_lane_command.sh headless-cpu node scripts/evaluate_round_e_cpu_materials.cjs
          bash scripts/release_lane_command.sh linux-native-vulkan cargo check --examples
          cargo check --example scene_inspection --features inspection
          cargo run -p xtask -- doctor --full
          cargo run -p xtask -- claim-audit
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
      - name: Release lane artifact
        run: |
          cargo run -p xtask -- release-lane-artifact linux-native-vulkan
          cargo run -p xtask -- release-lane-artifact headless-cpu
      - name: Upload gate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-native-vulkan-gate-artifacts
          path: target/gate-artifacts/**
          if-no-files-found: error

  linux-browser-webgl2:
    name: Linux browser WebGL2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.0"
          cache: npm
      - name: Install pinned browser driver
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Browser proof
        env:
          SCENA_BROWSER_BACKENDS: webgl2
        run: |
          wasm-pack test --headless --chrome --test m1_browser_rendered_output
          wasm-pack test --headless --chrome --test m3a_browser_rendered_output
          wasm-pack test --headless --chrome --test m3b_browser_rendered_output
          wasm-pack test --headless --chrome --test m6_browser_renderer_parity --features browser-probe
          bash scripts/release_lane_command.sh linux-webgl2-chromium wasm-pack build --dev --target web --out-dir target/m6-browser-pkg . --features browser-probe
          bash scripts/release_lane_command.sh linux-webgl2-chromium npm run browser:m6
          bash scripts/release_lane_command.sh linux-webgl2-chromium npm run browser:scene-host-proof
          bash scripts/release_lane_command.sh linux-webgl2-chromium npm run browser:fr06-semantic-aov
          bash scripts/release_lane_command.sh linux-webgl2-chromium npm run demo:build
          bash scripts/release_lane_command.sh linux-webgl2-chromium npm run proof:build
          python3 -m http.server 18104 --directory demo > target/gate-artifacts/cloudflare-demo-server.log 2>&1 &
          demo_server_pid=$!
          trap 'kill "$demo_server_pid" 2>/dev/null || true' EXIT
          bash scripts/release_lane_command.sh linux-webgl2-chromium npm run cloudflare:demo -- http://127.0.0.1:18104/index.html
          bash scripts/release_lane_command.sh linux-webgl2-chromium npm run cloudflare:materials -- http://127.0.0.1:18104/proof/?sample=material-presets
          kill "$demo_server_pid" 2>/dev/null || true
          trap - EXIT
          cargo run -p xtask -- release-lane-artifact linux-webgl2-chromium
      - name: Upload browser artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-browser-webgl2-gate-artifacts
          path: target/gate-artifacts/**
          if-no-files-found: error

  linux-browser-webgpu:
    name: Linux browser WebGPU
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.0"
          cache: npm
      - name: Install pinned browser driver
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Browser WebGPU proof through Rust/WASM
        env:
          SCENA_BROWSER_BACKENDS: webgpu
          SCENA_REQUIRE_PARITY: "1"
        run: |
          npm run test:required-gpu-parity
          bash scripts/release_lane_command.sh linux-webgpu-chromium wasm-pack build --dev --target web --out-dir target/m6-browser-pkg . --features browser-probe
          bash scripts/release_lane_command.sh linux-webgpu-chromium npm run browser:q02-materials
          bash scripts/release_lane_command.sh linux-webgpu-chromium npm run browser:m6
          bash scripts/release_lane_command.sh linux-webgpu-chromium npm run browser:fr06-semantic-aov
          cargo run -p xtask -- release-lane-artifact linux-webgpu-chromium
      - name: Upload browser artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linux-browser-webgpu-gate-artifacts
          path: target/gate-artifacts/**
          if-no-files-found: error

  wasm32:
    name: wasm32 compile and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.0"
          cache: npm
      - name: Install pinned size-gate tools
        run: npm ci
      - name: WASM compile
        run: cargo check --target wasm32-unknown-unknown --all-features
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: WASM release build
        run: bash scripts/release_lane_command.sh wasm32-unknown-unknown wasm-pack build --release --target web --out-dir target/m9-browser-pkg . --features browser-probe
      - name: WASM size gate
        run: bash scripts/release_lane_command.sh wasm32-unknown-unknown npm run wasm:size
      - name: Release lane artifact
        run: cargo run -p xtask -- release-lane-artifact wasm32-unknown-unknown
      - name: Upload WASM package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: wasm32-package
          path: |
            target/m9-browser-pkg/**
            target/gate-artifacts/**
          if-no-files-found: error

  macos-metal:
    name: macOS Metal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: rustfmt, clippy
      - name: Platform parity gates
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          bash scripts/release_lane_command.sh macos-metal cargo test --test m9_platform_release
          SCENA_RUN_UNSTABLE_HEADLESS_GPU_RELEASE_TESTS=1 bash scripts/release_lane_command.sh macos-metal cargo test --test m8_real_asset_proof m8_real_asset_waterbottle_gpu_headline -- --exact
          bash scripts/release_lane_command.sh macos-metal cargo check --examples
          cargo run -p xtask -- doctor --full
      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features
      - name: Release lane artifact
        run: |
          cargo run -p xtask -- release-lane-artifact macos-metal
      - name: Upload gate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: macos-metal-gate-artifacts
          path: target/gate-artifacts/**
          if-no-files-found: error

  windows-dx12:
    name: Windows DX12
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: rustfmt, clippy
      - name: Platform parity gates
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          bash scripts/release_lane_command.sh windows-dx12 cargo test --test m9_platform_release
          bash scripts/release_lane_command.sh windows-dx12 cargo check --examples
          cargo run -p xtask -- doctor --full
      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features
      - name: Release lane artifact
        run: |
          cargo run -p xtask -- release-lane-artifact windows-dx12
      - name: Upload gate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-dx12-gate-artifacts
          path: target/gate-artifacts/**
          if-no-files-found: error

  headless-4k-performance:
    name: Headless 4K performance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
      - name: Dedicated 4K benchmark
        env:
          SCENA_RUN_DEDICATED_4K_BENCHMARK: "1"
          SCENA_BENCHMARK_PROFILE: perf-test
          SCENA_BENCHMARK_COMMAND: cargo test --profile perf-test --test m9_platform_release m9_dedicated_headless_4k_benchmark_writes_release_blocker_artifact
        run: cargo test --profile perf-test --test m9_platform_release m9_dedicated_headless_4k_benchmark_writes_release_blocker_artifact
      - name: Upload 4K benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: headless-4k-performance-gate-artifacts
          path: target/gate-artifacts/**
          if-no-files-found: error

  premerge-release-evidence-integrity:
    name: Pre-merge release evidence integrity
    runs-on: ubuntu-24.04
    needs:
      - linux-native-vulkan
      - linux-browser-webgl2
      - linux-browser-webgpu
      - wasm32
      - macos-metal
      - windows-dx12
      - headless-4k-performance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
      - name: Download release lane artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: target/release-artifacts
      - name: Validate source evidence while independent reviews remain external
        shell: bash
        run: |
          set +e
          cargo run -p xtask -- stage-release-artifacts \
            target/release-artifacts target/gate-artifacts \
            > target/release-artifacts/release-evidence-integrity-report.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F "RELEASE-REVIEWS-MISSING:" \
            target/release-artifacts/release-evidence-integrity-report.log
      - name: Upload release evidence integrity report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: premerge-release-evidence-integrity-report
          path: target/release-artifacts/release-evidence-integrity-report.log
          if-no-files-found: warn
