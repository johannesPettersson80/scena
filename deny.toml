[advisories]
version = 2
# `ttf-parser` is pulled by the current `fontdue` 0.9.3 release. Revisit this
# when replacing the font rasterization path with a maintained parser.
ignore = ["RUSTSEC-2026-0192"]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "WTFPL",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
